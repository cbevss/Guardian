<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password · Guardian</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="nav"><div class="wrap"><a class="logo" href="/">
  <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2 28 7v9c0 6.5-5.5 11.5-12 14C9.5 27.5 4 22.5 4 16V7z" fill="#4f7cff"/><rect x="11.5" y="16" width="9" height="8" rx="1.5" fill="#fff"/><path d="M13 16v-3c0-2.2 6-2.2 6 0v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
  Guardian</a></div></nav>
<main class="center"><div class="wrap" style="display:grid;place-items:center">
  <form class="card pop" id="f1">
    <h1>Reset your password</h1>
    <p>Type the email you use for Guardian. If it has an account, we'll email you a 6-digit code.</p>
    <input type="email" id="email" placeholder="Email address" autocomplete="email" required>
    <div class="msg" id="m1"></div>
    <button class="btn btn-primary" id="b1">Email me a code</button>
  </form>
  <form class="card" id="f2" hidden>
    <h1>Check your email</h1>
    <p id="sentto"></p>
    <input type="text" id="code" placeholder="6-digit code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
    <input type="password" id="pw" placeholder="New password (8+ characters)" autocomplete="new-password" required>
    <input type="password" id="pw2" placeholder="New password again" autocomplete="new-password" required>
    <div class="msg" id="m2"></div>
    <button class="btn btn-primary" id="b2">Set new password</button>
  </form>
  <div class="card" id="done" hidden>
    <h1>Password changed</h1>
    <p>Open Guardian and sign in with your new password. Your saved PC stays linked.</p>
    <a class="btn btn-ghost" href="/">Back to Guardian</a>
  </div>
</div></main>
<script>
const $ = id => document.getElementById(id);
const post = (p, b) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json()).catch(() => ({ ok: false, error: 'offline' }));
const msg = (el, t, good) => { el.textContent = t; el.className = 'msg ' + (good ? 'good' : 'bad'); };
$('f1').onsubmit = async e => {
  e.preventDefault(); $('b1').disabled = true;
  const r = await post('/api/reset/request', { email: $('email').value });
  $('b1').disabled = false;
  if (!r.ok) return msg($('m1'), r.error === 'wait' ? 'A code was sent less than a minute ago. Check your inbox and spam folder.' : "Couldn't send the email right now. Try again in a minute.");
  $('sentto').textContent = `If ${$('email').value} has a Guardian account, a code is on its way. It works for 15 minutes.`;
  $('f1').hidden = true; $('f2').hidden = false; $('code').focus();
};
$('f2').onsubmit = async e => {
  e.preventDefault();
  if ($('pw').value.length < 8) return msg($('m2'), 'Use at least 8 characters.');
  if ($('pw').value !== $('pw2').value) return msg($('m2'), "The two passwords don't match.");
  $('b2').disabled = true;
  const r = await post('/api/reset/confirm', { email: $('email').value, code: $('code').value, password: $('pw').value });
  $('b2').disabled = false;
  if (!r.ok) return msg($('m2'), r.error === 'expired' ? 'That code has expired. Go back and ask for a new one.' : 'That code is wrong. Check the email and try again.');
  $('f2').hidden = true; $('done').hidden = false;
};
</script>
</body>
</html>
