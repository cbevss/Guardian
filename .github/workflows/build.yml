name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach installers to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --workspace

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "GUARDIAN_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installers
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\child.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\parent.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Guardian-installers
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
