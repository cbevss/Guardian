# Every push to main builds Guardian on Windows and publishes it as a new release.
# No tags needed: the version is 1.0.<build number>.
#  - Your PC: the Guardian app updates itself from these releases.
#  - His PC: the protected service downloads the new guardian-agent.exe and restarts.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        shell: bash
        run: echo "GUARDIAN_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace

      - name: Build Guardian
        run: cargo build --release --workspace

      - name: Build the child PC installer
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\child.iss

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${GUARDIAN_VERSION}" --target "$GITHUB_SHA" --title "Guardian ${GUARDIAN_VERSION}" \
            --notes "$(git log -1 --pretty=%s)"

      - name: Build and publish the Guardian app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npm version $env:GUARDIAN_VERSION --no-git-tag-version --allow-same-version
          npm run release

      - name: Add the child PC files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/guardian-agent.exe dist/guardian-agent.exe
          gh release upload "v${GUARDIAN_VERSION}" dist/guardian-agent.exe dist/Guardian-Child-PC-Setup.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Guardian
          path: |
            dist/desktop/Guardian-Setup.exe
            dist/Guardian-Child-PC-Setup.exe
