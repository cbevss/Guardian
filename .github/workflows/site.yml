# Publishes the Guardian website + account server to Cloudflare on every push
# that touches site/. Needs two repository secrets (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages, right-hand side)
# Until they're added, this workflow skips itself.
name: Publish website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare is set up
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'yes'
        with:
          node-version: 22
      - name: Install
        if: steps.cf.outputs.ready == 'yes'
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Update the database layout
        if: steps.cf.outputs.ready == 'yes'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute guardian --remote --file=schema.sql
      - name: Publish
        if: steps.cf.outputs.ready == 'yes'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
